<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>情報中心</title>

    <!-- ── PWA Meta ── -->
    <meta name="theme-color" content="#f7f4ef">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="情報中心">
    <meta name="application-name" content="情報中心">
    <meta name="description" content="個人化 RSS 資訊聚合中心">

    <!-- ── PWA Icons ── -->
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./icons/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" sizes="192x192" href="./icons/icon-192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="./icons/icon-512.png">

    <!-- ── Google Fonts ── -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;700&family=Noto+Sans+TC:wght@300;400;500&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --ink: #1a1410;
            --ink-mid: #4a3f35;
            --ink-light: #8a7a6a;
            --ink-faint: #c8bfb5;
            --paper: #f7f4ef;
            --paper-warm: #f0ebe3;
            --paper-dark: #e8e2d8;
            --red-seal: #8b1a1a;
            --red-light: #c44444;
            --accent: #2a4a6a;
            --rule: #d4ccc4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans TC', 'Hiragino Kaku Gothic ProN', sans-serif;
            background: var(--paper);
            color: var(--ink);
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* ── Header ── */
        header {
            padding: max(20px, env(safe-area-inset-top)) 40px 20px;
            border-bottom: 2px solid var(--ink);
            display: flex;
            align-items: baseline;
            gap: 16px;
            flex-wrap: wrap;
            background: var(--paper);
        }

        header h1 {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--ink);
            letter-spacing: 0.12em;
        }

        header h1::after {
            content: '';
            display: inline-block;
            width: 6px;
            height: 6px;
            background: var(--red-seal);
            border-radius: 50%;
            margin-left: 8px;
            vertical-align: middle;
        }

        #update-time {
            font-size: 0.72rem;
            color: var(--ink-light);
            font-family: 'Noto Sans TC', sans-serif;
        }

        .header-right {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* ── View Toggle ── */
        .view-toggle {
            display: flex;
            border: 1px solid var(--rule);
            overflow: hidden;
            background: var(--paper-warm);
        }

        .view-btn {
            padding: 6px 14px;
            border: none;
            background: transparent;
            color: var(--ink-light);
            cursor: pointer;
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .view-btn svg {
            width: 13px;
            height: 13px;
            flex-shrink: 0;
        }

        .view-btn:hover {
            color: var(--ink);
            background: var(--paper-dark);
        }

        .view-btn.active {
            background: var(--ink);
            color: var(--paper);
        }

        /* ── Translate & Refresh buttons ── */
        #translate-btn,
        #refresh-btn {
            background: var(--paper-warm);
            border: 1px solid var(--rule);
            color: var(--ink-light);
            padding: 6px 14px;
            cursor: pointer;
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            white-space: nowrap;
        }

        #translate-btn svg {
            width: 13px;
            height: 13px;
            flex-shrink: 0;
        }

        #translate-btn:hover:not(:disabled),
        #refresh-btn:hover {
            background: var(--paper-dark);
            color: var(--ink);
        }

        #translate-btn.active {
            background: #e8f0e8;
            border-color: #a0c0a0;
            color: #2a5a2a;
        }

        #translate-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ── Status bar ── */
        #status {
            padding: 8px 40px;
            font-size: 0.7rem;
            color: var(--ink-light);
            min-height: 30px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--rule);
            font-family: 'Noto Sans TC', sans-serif;
        }

        #progress-bar-wrap {
            display: none;
            flex: 1;
            max-width: 180px;
            height: 2px;
            background: var(--paper-dark);
        }

        #progress-bar {
            height: 100%;
            background: var(--red-seal);
            width: 0%;
            transition: width 0.3s;
        }

        .proxy-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--ink-faint);
            flex-shrink: 0;
            transition: background 0.4s;
        }

        .proxy-dot.ok {
            background: #5a9a5a;
        }

        .proxy-dot.fail {
            background: var(--red-seal);
        }

        .proxy-dot.try {
            background: #c0a000;
            animation: pulse 0.8s infinite;
        }

        /* ══════════════════════════════════
       MODE A — List view
    ══════════════════════════════════ */
        #feed.list-view {
            background: var(--paper-warm);
        }

        #feed.list-view .group-body {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 0;
        }

        #feed.list-view .source-block {
            background: var(--paper);
            padding: 20px 24px;
            border-right: 1px solid var(--rule);
            border-bottom: 1px solid var(--rule);
        }

        #feed.list-view .source-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--rule);
        }

        #feed.list-view .source-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        #feed.list-view .source-name {
            font-family: 'Noto Serif TC', serif;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: var(--ink-mid);
        }

        #feed.list-view .source-count {
            margin-left: auto;
            font-size: 0.65rem;
            color: var(--ink-faint);
        }

        #feed.list-view .news-item {
            display: flex;
            align-items: baseline;
            gap: 8px;
            padding: 9px 0;
            border-bottom: 1px solid #ede8e0;
            cursor: pointer;
        }

        #feed.list-view .news-item:last-child {
            border-bottom: none;
        }

        #feed.list-view .news-item::before {
            content: "";
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: var(--ink-faint);
            flex-shrink: 0;
            margin-top: 8px;
        }

        #feed.list-view .news-item a {
            flex: 1;
            color: var(--ink-mid);
            text-decoration: none;
            font-size: 0.83rem;
            line-height: 1.7;
            transition: color 0.2s;
        }

        #feed.list-view .news-item:hover a {
            color: var(--ink);
        }

        #feed.list-view .news-item:hover::before {
            background: var(--red-seal);
        }

        #feed.list-view .news-meta {
            flex-shrink: 0;
            font-size: 0.65rem;
            color: var(--ink-faint);
            white-space: nowrap;
        }

        /* ══════════════════════════════════
       MODE B — Card view
    ══════════════════════════════════ */
        #feed.card-view { }

        #feed.card-view .group-body {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 20px;
            padding: 16px 40px 24px;
        }

        #feed.card-view .source-block {
            background: transparent;
        }

        #feed.card-view .source-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        #feed.card-view .source-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        #feed.card-view .source-name {
            font-family: 'Noto Serif TC', serif;
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: var(--ink-mid);
        }

        #feed.card-view .source-count {
            margin-left: auto;
            font-size: 0.63rem;
            color: var(--ink-faint);
        }

        #feed.card-view .items {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        #feed.card-view .news-item {
            background: var(--paper-warm);
            border: 1px solid var(--rule);
            overflow: hidden;
            transition: box-shadow 0.2s, border-color 0.2s;
            cursor: pointer;
        }

        #feed.card-view .news-item:hover {
            border-color: var(--ink-light);
            box-shadow: 0 2px 8px rgba(26, 20, 16, 0.08);
        }

        #feed.card-view .card-thumb {
            width: 100%;
            height: 140px;
            object-fit: cover;
            display: block;
        }

        #feed.card-view .card-thumb-placeholder {
            width: 100%;
            height: 140px;
            background: var(--paper-dark);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #feed.card-view .card-thumb-placeholder svg {
            width: 28px;
            height: 28px;
            opacity: 0.2;
            color: var(--ink-mid);
        }

        #feed.card-view .card-body {
            padding: 12px 14px 13px;
        }

        #feed.card-view .news-item a {
            display: block;
            color: var(--ink-mid);
            text-decoration: none;
            font-size: 0.83rem;
            line-height: 1.65;
            font-weight: 400;
            transition: color 0.2s;
        }

        #feed.card-view .news-item:hover a {
            color: var(--ink);
        }

        #feed.card-view .news-meta {
            margin-top: 6px;
            font-size: 0.65rem;
            color: var(--ink-faint);
        }

        /* ── Category header (list & card) ── */
        .group-header {
            padding: 18px 24px 6px;
            font-family: 'Noto Serif TC', serif;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--red-seal);
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
        }

        .group-header:hover {
            background: var(--paper-dark);
        }

        .group-arrow {
            font-size: 0.5rem;
            color: var(--ink-faint);
            transition: transform 0.2s ease;
            margin-left: 8px;
            flex-shrink: 0;
        }

        .group-section:not(.collapsed) .group-arrow {
            transform: rotate(90deg);
        }

        #feed .group-section.collapsed .group-body {
            display: none;
        }

        #feed.list-view .group-header {
            background: var(--paper-warm);
            border-top: 2px solid var(--rule);
            border-bottom: none;
            padding: 12px 24px 8px;
        }

        #feed.list-view .group-section:first-child .group-header {
            border-top: none;
        }

        #feed.card-view .group-header {
            padding: 14px 40px 8px;
        }

        /* ── Shared ── */
        .loading-text {
            padding: 60px;
            color: var(--ink-light);
            font-size: 0.85rem;
            text-align: center;
            grid-column: 1 / -1;
            font-family: 'Noto Serif TC', serif;
        }

        .error-text {
            color: var(--red-seal);
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0.2
            }

            50% {
                opacity: 1
            }
        }

        .loading-dot {
            animation: pulse 1.5s ease-in-out infinite;
            display: inline-block;
        }

        #feed.list-view .news-item.error a,
        #feed.card-view .news-item.error a {
            color: #9a6060;
            font-style: italic;
        }

        #feed.list-view .news-item a.translating,
        #feed.card-view .news-item a.translating {
            color: transparent;
            background: linear-gradient(90deg, #ede8e0 25%, #f7f4ef 50%, #ede8e0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.2s infinite;
            pointer-events: none;
            border-radius: 2px;
        }

        @keyframes shimmer {
            0% {
                background-position: 200% 0
            }

            100% {
                background-position: -200% 0
            }
        }

        /* ══════════════════════════════════
       Side Panel
    ══════════════════════════════════ */
        #panel-overlay {
            position: fixed;
            inset: 0;
            background: rgba(26, 20, 16, 0.4);
            backdrop-filter: blur(3px);
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.28s;
        }

        #panel-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        #side-panel {
            position: fixed;
            top: 0;
            right: 0;
            width: min(860px, 100vw);
            height: 100vh;
            background: var(--paper);
            border-left: 2px solid var(--ink);
            z-index: 101;
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
            transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        #side-panel.open {
            transform: translateX(0);
        }

        #panel-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 18px;
            border-bottom: 1px solid var(--rule);
            flex-shrink: 0;
        }

        #panel-source-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: var(--ink-light);
            flex-shrink: 0;
        }

        #panel-source-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        #panel-title-bar {
            flex: 1;
            overflow: hidden;
            font-size: 0.8rem;
            color: var(--ink-mid);
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .panel-icon-btn {
            background: none;
            border: none;
            color: var(--ink-faint);
            cursor: pointer;
            padding: 5px;
            display: flex;
            align-items: center;
            transition: color 0.15s;
            flex-shrink: 0;
        }

        .panel-icon-btn:hover {
            color: var(--ink);
        }

        .panel-icon-btn svg {
            width: 14px;
            height: 14px;
        }

        #panel-iframe-wrap {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        #panel-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: #fff;
        }

        #panel-loading {
            position: absolute;
            inset: 0;
            background: var(--paper);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            z-index: 2;
            transition: opacity 0.3s;
        }

        #panel-loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 26px;
            height: 26px;
            border: 2px solid var(--rule);
            border-top-color: var(--ink-mid);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #panel-loading p {
            font-size: 0.75rem;
            color: var(--ink-light);
        }

        #panel-rss {
            position: absolute;
            inset: 0;
            background: var(--paper);
            display: none;
            flex-direction: column;
            z-index: 3;
            overflow: hidden;
        }

        #panel-rss.show {
            display: flex;
        }

        #panel-rss-hero {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
            flex-shrink: 0;
        }

        #panel-rss-hero.hidden {
            display: none;
        }

        #panel-rss-body {
            flex: 1;
            overflow-y: auto;
            padding: 22px 30px 24px;
            scrollbar-width: thin;
            scrollbar-color: var(--rule) transparent;
        }

        #panel-rss-body::-webkit-scrollbar {
            width: 4px;
        }

        #panel-rss-body::-webkit-scrollbar-thumb {
            background: var(--rule);
            border-radius: 2px;
        }

        #panel-rss-notice {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.68rem;
            color: var(--ink-light);
            background: var(--paper-warm);
            border: 1px solid var(--rule);
            padding: 4px 12px;
            border-radius: 2px;
            margin-bottom: 16px;
        }

        #panel-rss-notice svg {
            width: 11px;
            height: 11px;
        }

        #panel-rss-title {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.2rem;
            font-weight: 700;
            line-height: 1.6;
            color: var(--ink);
            margin-bottom: 12px;
        }

        #panel-rss-meta {
            font-size: 0.7rem;
            color: var(--ink-light);
            margin-bottom: 20px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        #panel-rss-content {
            font-size: 0.88rem;
            line-height: 1.9;
            color: var(--ink-mid);
            border-top: 1px solid var(--rule);
            padding-top: 18px;
        }

        #panel-rss-content img {
            max-width: 100%;
            border-radius: 2px;
            margin: 10px 0;
            display: block;
        }

        #panel-rss-content a {
            color: var(--accent);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.15s;
        }

        #panel-rss-content a:hover {
            border-color: var(--accent);
        }

        #panel-rss-content p {
            margin-bottom: 14px;
        }

        #panel-rss-content p:last-child {
            margin-bottom: 0;
        }

        #panel-rss-content figure,
        #panel-rss-content figcaption {
            margin: 0;
            font-size: 0.78rem;
            color: var(--ink-light);
        }

        #panel-rss-footer {
            padding: 12px 30px;
            border-top: 1px solid var(--rule);
            flex-shrink: 0;
        }

        #panel-rss-open {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--ink);
            color: var(--paper);
            border: none;
            padding: 8px 20px;
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 0.8rem;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.2s;
        }

        #panel-rss-open:hover {
            background: var(--ink-mid);
        }

        #panel-rss-open svg {
            width: 12px;
            height: 12px;
        }

        /* ── PWA Install Banner ── */
        #pwa-banner {
            display: none;
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--paper-warm);
            border: 1px solid var(--ink-faint);
            padding: 12px 18px;
            z-index: 200;
            align-items: center;
            gap: 12px;
            font-size: 0.82rem;
            color: var(--ink-mid);
            box-shadow: 0 4px 20px rgba(26, 20, 16, 0.15);
            max-width: 340px;
            width: calc(100vw - 40px);
            animation: slideUp 0.3s ease;
        }

        #pwa-banner.visible {
            display: flex;
        }

        #pwa-banner-icon {
            width: 36px;
            height: 36px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        #pwa-banner-text {
            flex: 1;
        }

        #pwa-banner-text strong {
            display: block;
            color: var(--ink);
            margin-bottom: 2px;
            font-size: 0.85rem;
        }

        #pwa-install-btn {
            background: var(--ink);
            border: none;
            color: var(--paper);
            padding: 7px 14px;
            cursor: pointer;
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 0.78rem;
            white-space: nowrap;
            flex-shrink: 0;
        }

        #pwa-install-btn:hover {
            background: var(--ink-mid);
        }

        #pwa-dismiss-btn {
            background: none;
            border: none;
            color: var(--ink-faint);
            cursor: pointer;
            padding: 4px;
            font-size: 1.1rem;
            flex-shrink: 0;
            line-height: 1;
        }

        @keyframes slideUp {
            from {
                transform: translateX(-50%) translateY(20px);
                opacity: 0;
            }

            to {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
            }
        }

        /* ── Category nav bar ── */
        #cat-bar {
            position: sticky;
            top: 0;
            z-index: 50;
            background: var(--paper);
            border-bottom: 1px solid var(--rule);
            display: flex;
            gap: 2px;
            padding: 6px 40px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        #cat-bar::-webkit-scrollbar {
            display: none;
        }

        .cat-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--red-seal);
            padding: 3px 12px;
            font-family: 'Noto Serif TC', serif;
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.15s;
        }

        .cat-btn:hover {
            background: var(--paper-warm);
            border-color: var(--rule);
        }

        .cat-btn.active {

        /* ═══════════════════════════════════════════════════

        const WORKER_URL = "https://rss-aggregator.s01yg3642.workers.dev/api";

        /* ═══════════════════════════════════════════════════
        State

        let currentView = "list";

        /* ═══════════════════════════════════════════════════
        Side Panel
        ═══════════════════════════════════════════════════ */
        function openPanel(id) {
            const { item, source } = itemsMap[id];
            const url = item.link;
            const title = (translateMode && item.titleZh) ? item.titleZh : item.title;

            document.getElementById("panel-source-dot").style.background = source.color;
            document.getElementById("panel-source-name").textContent = source.name;
            document.getElementById("panel-title-bar").textContent = title;
            document.getElementById("panel-ext-btn").href = url;

            const loading = document.getElementById("panel-loading");
            const rssPane = document.getElementById("panel-rss");
            const iframe = document.getElementById("panel-iframe");

            loading.classList.remove("hidden");
            rssPane.classList.remove("show");
            iframe.src = "about:blank";

            let timer;

            function onLoad() {
                clearTimeout(timer);
                loading.classList.add("hidden");
                try {
                    const doc = iframe.contentDocument || iframe.contentWindow.document;
                    if (!doc || !doc.body || doc.body.innerHTML.trim() === "") showRssFallback();
                } catch { /* 跨域正常 */ }
            }

            function onError() {
                clearTimeout(timer);
                loading.classList.add("hidden");
                showRssFallback();
            }

            function showRssFallback() {
                const imgSrc = item.thumbnail || item.enclosure?.link || "";
                const hero = document.getElementById("panel-rss-hero");
                if (imgSrc) {
                    hero.src = imgSrc;
                    hero.classList.remove("hidden");
                    hero.onerror = () => hero.classList.add("hidden");
                } else {
                    hero.classList.add("hidden");
                }
                document.getElementById("panel-rss-title").textContent = title;
                document.getElementById("panel-rss-date").textContent = formatDate(item.pubDate) || "";
                const auth = document.getElementById("panel-rss-author");
                auth.textContent = item.author ? "by " + item.author : "";

                const raw = item.content || item.description || "<p>（此來源未提供摘要）</p>";
                const tmp = document.createElement("div");
                tmp.innerHTML = raw;
                tmp.querySelectorAll("script, style, iframe, form, input").forEach(el => el.remove());
                tmp.querySelectorAll("a").forEach(a => { a.target = "_blank"; a.rel = "noopener"; });
                document.getElementById("panel-rss-content").innerHTML = tmp.innerHTML;

                document.getElementById("panel-rss-open").href = url;
                document.getElementById("panel-rss-body").scrollTop = 0;
                rssPane.classList.add("show");
            }

            iframe.addEventListener("load", onLoad, { once: true });
            iframe.addEventListener("error", onError, { once: true });
            timer = setTimeout(() => { loading.classList.add("hidden"); showRssFallback(); }, 12000);
            iframe.src = url;

            document.getElementById("panel-overlay").classList.add("open");
            document.getElementById("side-panel").classList.add("open");
            document.body.style.overflow = "hidden";
        }

        function closePanel() {
            document.getElementById("panel-overlay").classList.remove("open");
            document.getElementById("side-panel").classList.remove("open");
            document.body.style.overflow = "";
        }

        document.addEventListener("keydown", e => { if (e.key === "Escape") closePanel(); });

        /* ═══════════════════════════════════════════════════
        Helpers
        ═══════════════════════════════════════════════════ */
        function formatDate(str) {
            if (!str) return "";
            const d = new Date(str);
            if (isNaN(d)) return "";
            const diff = (Date.now() - d) / 1000;
            if (diff < 3600) return Math.floor(diff / 60) + " 分鐘前";
            if (diff < 86400) return Math.floor(diff / 3600) + " 小時前";
            return d.toLocaleDateString("zh-TW", { month: "short", day: "numeric" });
        }

        function thumbHTML(item) {
            const src = item.thumbnail || item.enclosure?.link || "";
            if (src) {
                return `<img class="card-thumb" src="${src}" alt="" loading="lazy"
        onerror="this.outerHTML=\`<div class='card-thumb-placeholder'><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.5'><rect x='3' y='3' width='18' height='18' rx='2'/><circle cx='8.5' cy='8.5' r='1.5'/><path d='M21 15l-5-5L5 21'/></svg></div>\`">`;
            }
            return `<div class="card-thumb-placeholder">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <path d="M21 15l-5-5L5 21"/>
        </svg>
    </div>`;
        }

        function displayTitle(item) {
            return (translateMode && item.titleZh) ? item.titleZh : item.title;
        }

        function stripHtml(html) {
            if (!html) return "";
            const tmp = document.createElement("div");
            tmp.innerHTML = html;
            return (tmp.textContent || tmp.innerText || "").trim();
        }

        /* ═══════════════════════════════════════════════════
        XML Parser（RSS 2.0 / Atom / media: / dc:）
        ═══════════════════════════════════════════════════ */
        function parseItems(xml) {
            const isAtom = xml.querySelector("feed") !== null;
            const nodes = [...xml.querySelectorAll(isAtom ? "entry" : "item")].slice(0, COUNT);

            return nodes.map(el => {
                const txt = (...tags) => {
                    for (const t of tags) {
                        const v = el.getElementsByTagName(t)[0]?.textContent?.trim();
                        if (v) return v;
                    }
                    return "";
                };
                const atr = (tag, attr) => el.getElementsByTagName(tag)[0]?.getAttribute(attr) || "";

                const title = stripHtml(txt("title"));
                const linkEl = el.querySelector("link[href]");
                const link = linkEl?.getAttribute("href") || txt("link");
                const pubDate = txt("pubDate", "published", "updated", "dc:date");

                const authorEl = el.getElementsByTagName("author")[0];
                const authorName = authorEl?.getElementsByTagName("name")[0]?.textContent?.trim()
                    || authorEl?.textContent?.trim()
                    || txt("dc:creator", "creator");

                const content = txt("content:encoded", "content", "description", "summary");

                let thumbnail = atr("media:thumbnail", "url") || atr("media:content", "url");
                if (!thumbnail) {
                    const enc = el.getElementsByTagName("enclosure")[0];
                    const mime = enc?.getAttribute("type") || "";
                    if (mime.startsWith("image/")) thumbnail = enc?.getAttribute("url") || "";
                }

                return {
                    title, link, pubDate, author: authorName,
                    content, description: content,
                    thumbnail, enclosure: { link: thumbnail }
                };
            });
        }

        /* ═══════════════════════════════════════════════════
        Render
        ═══════════════════════════════════════════════════ */
        let itemCounter = 0;

        function renderSource(source, items, container) {
            const block = document.createElement("div");
            block.className = "source-block";
            block.innerHTML = `
        <div class="source-header">
            <span class="source-dot" style="background:${source.color}"></span>
            <span class="source-name">${source.name}</span>
            <span class="source-count">${items.length} 則</span>
        </div>
        <div class="items"></div>`;

            const itemsEl = block.querySelector(".items");

            items.forEach(item => {
                const id = "item-" + (itemCounter++);
                const isErr = item.link === "#";
                itemsMap[id] = { item, source };

                const div = document.createElement("div");
                div.className = "news-item" + (isErr ? " error" : "");
                div.dataset.id = id;

                if (currentView === "list") {
                    div.innerHTML = `
        <a href="${item.link}" data-id="${id}">${displayTitle(item)}</a>
        ${isErr ? "" : `<span class="news-meta">${formatDate(item.pubDate)}</span>`}`;
                } else {
                    div.innerHTML = `
        ${thumbHTML(item)}
        <div class="card-body">
            <a href="${item.link}" data-id="${id}">${displayTitle(item)}</a>
            <div class="news-meta">${formatDate(item.pubDate)}</div>
        </div>`;
                }

                if (!isErr) {
                    div.addEventListener("click", e => {
                        const anchor = e.target.closest("a[data-id]") || e.currentTarget.querySelector("a[data-id]");
                        if (!anchor) return;
                        e.preventDefault();
                        openPanel(anchor.dataset.id);
                    });
                }

                itemsEl.appendChild(div);
            });

            container.appendChild(block);
        }

        function renderAll() {
            itemsMap = {};
            itemCounter = 0;
            const feed = document.getElementById("feed");
            feed.innerHTML = "";

            // Collect groups in order
            const groups = [];
            const groupSources = {};
            cachedData.forEach(({ source, items }) => {
                const g = source.group || '其他';
                if (!groupSources[g]) { groupSources[g] = []; groups.push(g); }
                groupSources[g].push({ source, items });
            });

            // Populate cat-bar
            const catBar = document.getElementById("cat-bar");
            catBar.innerHTML = "";
            groups.forEach(g => {
                const btn = document.createElement("button");
                btn.className = "cat-btn";
                btn.textContent = g;
                btn.dataset.group = g;
                btn.addEventListener("click", () => scrollToGroup(g));
                catBar.appendChild(btn);
            });

            // Render each group as collapsible section
            groups.forEach(g => {
                const section = document.createElement("div");
                section.className = "group-section" + (expandedGroups.has(g) ? "" : " collapsed");
                section.dataset.group = g;

                const hdr = document.createElement("div");
                hdr.className = "group-header";
                hdr.innerHTML = `<span>${g}</span><span class="group-arrow">&#9654;</span>`;
                hdr.addEventListener("click", () => toggleGroup(g));
                section.appendChild(hdr);

                const body = document.createElement("div");
                body.className = "group-body";
                groupSources[g].forEach(({ source, items }) => renderSource(source, items, body));
                section.appendChild(body);

                feed.appendChild(section);
            });
        }

        function toggleGroup(g) {
            if (expandedGroups.has(g)) expandedGroups.delete(g);
            else expandedGroups.add(g);
            const section = [...document.querySelectorAll(".group-section")]
                .find(s => s.dataset.group === g);
            if (section) section.classList.toggle("collapsed", !expandedGroups.has(g));
            updateCatBtnActive();
        }

        function scrollToGroup(g) {
            const section = [...document.querySelectorAll(".group-section")]
                .find(s => s.dataset.group === g);
            if (!section) return;

            if (expandedGroups.has(g)) {
                // 已展開 → 收合
                expandedGroups.delete(g);
                section.classList.add("collapsed");
                updateCatBtnActive();
            } else {
                // 已收合 → 展開並捲動
                expandedGroups.add(g);
                section.classList.remove("collapsed");
                updateCatBtnActive();
                const headerH = document.querySelector("header").offsetHeight || 0;
                const catH = document.getElementById("cat-bar").offsetHeight || 0;
                const statusH = document.getElementById("status").offsetHeight || 0;
                const top = section.getBoundingClientRect().top + window.scrollY - headerH - catH - statusH - 4;
                window.scrollTo({ top: Math.max(0, top), behavior: "smooth" });
            }
        }

        function updateCatBtnActive() {
            document.querySelectorAll(".cat-btn").forEach(btn => {
                btn.classList.toggle("active", expandedGroups.has(btn.dataset.group));
            });
        }

        /* ═══════════════════════════════════════════════════
            View switch
        ═══════════════════════════════════════════════════ */
        function setView(mode) {
            currentView = mode;
            document.getElementById("feed").className = mode === "list" ? "list-view" : "card-view";
            document.getElementById("btn-list").classList.toggle("active", mode === "list");
            document.getElementById("btn-card").classList.toggle("active", mode === "card");
            if (cachedData.length) renderAll();
        }

        /* ═══════════════════════════════════════════════════
            Translation
        ═══════════════════════════════════════════════════ */
        async function translateText(text) {
            const url = "https://translate.googleapis.com/translate_a/single"
                + "?client=gtx&sl=auto&tl=zh-TW&dt=t&q=" + encodeURIComponent(text);
            const res = await fetch(url);
            const data = await res.json();
            return data[0].map(seg => seg[0]).join("");
        }

        async function toggleTranslate() {
            if (isTranslating) return;
            const allTranslated = cachedData.every(d => d.items.every(it => it.titleZh));
            if (allTranslated) {
                translateMode = !translateMode;
                updateTranslateBtn();
                renderAll();
                return;
            }

            translateMode = true;
            isTranslating = true;
            setTranslateBtnDisabled(true, "翻譯中…");

            const allItems = cachedData.flatMap(d => d.items.filter(it => !it.titleZh));
            const total = allItems.length;
            let done = 0;

            const progressWrap = document.getElementById("progress-bar-wrap");
            const progressBar = document.getElementById("progress-bar");
            progressWrap.style.display = "block";
            progressBar.style.width = "0%";
            setStatus("正在翻譯標題… 0 / " + total);

            document.querySelectorAll(".news-item a").forEach(a => a.classList.add("translating"));

            for (const item of allItems) {
                try { item.titleZh = await translateText(item.title); }
                catch { item.titleZh = item.title; }

                done++;
                progressBar.style.width = (done / total * 100) + "%";
                setStatus("正在翻譯標題… " + done + " / " + total);

                document.querySelectorAll(".news-item a").forEach(a => {
                    if ((a.href === item.link || a.getAttribute("href") === item.link)
                        && a.classList.contains("translating")) {
                        a.textContent = item.titleZh;
                        a.classList.remove("translating");
                    }
                });
            }

            renderAll();
            progressWrap.style.display = "none";
            isTranslating = false;
            updateTranslateBtn();
            setStatus("共 " + SOURCES.length + " 個來源 · 4 分類　·　已顯示繁體中文譯文");
        }

        function updateTranslateBtn() {
            document.getElementById("translate-btn").classList.toggle("active", translateMode);
            document.getElementById("translate-label").textContent = translateMode ? "原文" : "翻譯";
        }
        function setTranslateBtnDisabled(disabled, label) {
            document.getElementById("translate-btn").disabled = disabled;
            document.getElementById("translate-label").textContent = label;
        }
        function setStatus(msg) {
            document.getElementById("status-text").textContent = msg;
        }

        /* ═══════════════════════════════════════════════════
            Reload（透過 Cloudflare Worker 一次抓全部）
        ═══════════════════════════════════════════════════ */
        async function reload() {
            closePanel();
            const container = document.getElementById("feed");
            const timeEl = document.getElementById("update-time");

            cachedData = [];
            itemsMap = {};
            translateMode = false;
            isTranslating = false;
            updateTranslateBtn();
            setTranslateBtnDisabled(false, "翻譯");
            document.getElementById("progress-bar-wrap").style.display = "none";

            container.innerHTML = '<div class="loading-text"><span class="loading-dot">載入中…</span></div>';
            setStatus("正在連線 Worker…");
            const wDot = document.getElementById("worker-dot");
            if (wDot) wDot.style.background = "#7a6a30";  // 嘗試中：黃

            try {
                const ctrl = new AbortController();
                const timer = setTimeout(() => ctrl.abort(), 20000);

                const res = await fetch(WORKER_URL, { signal: ctrl.signal });
                clearTimeout(timer);

                if (!res.ok) throw new Error(`Worker 回應 HTTP ${res.status}`);

                const data = await res.json();
                if (!data.ok) throw new Error("Worker 回傳錯誤");

                /* Worker 回傳的 source 格式與前端完全一致，直接使用 */
                cachedData = data.sources.map(s => ({
                    source: {
                        name: s.name,
                        color: s.color,
                        group: s.group,
                        url: s.url,
                    },
                    /* 把 Worker item 格式補齊前端所需欄位 */
                    items: s.ok && s.items.length
                        ? s.items.map(it => ({
                            title: it.title,
                            link: it.link,
                            pubDate: it.pubDate,
                            author: it.author || "",
                            content: it.description || "",
                            description: it.description || "",
                            thumbnail: it.thumbnail || "",
                            enclosure: { link: it.thumbnail || "" },
                        }))
                        : [{
                            title: s.ok ? "此來源目前無文章" : "無法載入：" + (s.error || "未知錯誤"),
                            link: "#", pubDate: ""
                        }],
                }));

                /* 依照 SOURCES 原始順序排列 */
                cachedData.sort((a, b) => {
                    const ai = SOURCES.findIndex(s => s.name === a.source.name);
                    const bi = SOURCES.findIndex(s => s.name === b.source.name);
                    return ai - bi;
                });

                renderAll();
                if (wDot) wDot.style.background = "#3a7a50";  // 成功：綠

                const now = new Date();
                const failed = data.sources.filter(s => !s.ok).length;
                const cache = res.headers.get("X-Cache") === "HIT" ? "　·　快取命中" : "";
                const failNote = failed > 0 ? `　·　${failed} 個來源失敗` : "";

                timeEl.textContent = "更新於 " + now.toLocaleTimeString("zh-TW", { hour: "2-digit", minute: "2-digit" });
                setStatus(`共 ${data.sources.length} 個來源 · 4 分類${cache}${failNote}`);

            } catch (e) {
                container.innerHTML = `<div class="loading-text error-text">Worker 連線失敗：${e.message}<br><small>請確認 Worker 已部署，或檢查網路連線</small></div>`;
                if (wDot) wDot.style.background = "#7a3a3a";  // 失敗：紅
                setStatus("載入失敗");
            }
        }

        reload();
    </script>
