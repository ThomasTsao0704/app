<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF 智能分析系統 V3</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Header -->
<header class="header">
  <div class="header-brand">
    <div class="header-icon">📄</div>
    <div>
      <div class="header h1" style="font-size:15px;font-weight:600;letter-spacing:.04em">PDF 智能分析系統</div>
      <div class="header-sub">Offline Analysis Engine V3</div>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:12px">
    <button onclick="openModelManager()" style="padding:6px 16px;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;color:var(--text-secondary);font-family:var(--sans);font-size:12px;cursor:pointer;letter-spacing:.04em;transition:all 0.2s">🗂 模型管理</button>
    <button onclick="openSettings()" style="padding:6px 16px;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;color:var(--text-secondary);font-family:var(--sans);font-size:12px;cursor:pointer;letter-spacing:.04em;transition:all 0.2s">⚙️ 設定</button>
    <span class="badge-offline">● OFFLINE</span>
  </div>
</header>

<div class="container">
  <div class="grid-main">

    <!-- ── Left: Controls ── -->
    <div style="display:flex;flex-direction:column;gap:20px;">

      <!-- Upload Panel -->
      <div class="panel">
        <div class="panel-header">
          <span class="panel-dot"></span>
          文件輸入
        </div>
        <div class="panel-body">
          <div class="upload-zone" id="uploadZone">
            <input type="file" id="pdfUpload" accept="application/pdf" onchange="handleFileSelect(event)">
            <div class="upload-icon">📂</div>
            <div class="upload-text">點擊或拖曳 PDF 至此</div>
            <div class="upload-hint">僅限 .pdf 格式 · 完全離線處理</div>
          </div>
          <div class="file-info" id="fileInfo">
            <span>📄</span>
            <span class="name" id="fileName">-</span>
            <span id="fileSize" style="font-family:var(--mono);font-size:11px;color:var(--text-dim);flex-shrink:0"></span>
          </div>

          <!-- Stats -->
          <div class="stats-bar" id="statsBar">
            <div class="stat-item">
              <div class="stat-value" id="statPages">—</div>
              <div class="stat-label">頁數</div>
            </div>
            <div class="stat-item">
              <div class="stat-value" id="statChars">—</div>
              <div class="stat-label">字數</div>
            </div>
            <div class="stat-item">
              <div class="stat-value" id="statSents">—</div>
              <div class="stat-label">句數</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Mode Panel -->
      <div class="panel">
        <div class="panel-header">
          <span class="panel-dot" style="background:var(--yellow)"></span>
          分析模式
        </div>
        <div class="panel-body">
          <div class="mode-selector">
            <button class="mode-btn active" data-mode="finance" onclick="setMode('finance',this)">
              <span class="mode-icon">📊</span>財報模式
            </button>
            <button class="mode-btn" data-mode="news" onclick="setMode('news',this)">
              <span class="mode-icon">📰</span>新聞模式
            </button>
            <button class="mode-btn" data-mode="study" onclick="setMode('study',this)">
              <span class="mode-icon">📚</span>學習模式
            </button>
          </div>
          <div id="modeDesc" style="font-size:12px;color:var(--text-dim);padding:8px 12px;background:var(--bg-card);border-radius:6px;line-height:1.6">
            💹 財報分析模式：偵測營收、EPS、毛利率、成長訊號與風險因子
          </div>

          <select id="industrySelect" onchange="setIndustry(this.value)" style="width:100%;margin-top:12px;padding:10px 12px;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;color:var(--text-secondary);font-family:var(--sans);font-size:13px;cursor:pointer;outline:none;">
            <option value="">🌐 一般模式</option>
            <option value="semiconductor">🔬 半導體</option>
            <option value="finance">🏦 金融</option>
            <option value="ai">🤖 AI產業</option>
          </select>

          <div class="actions">
            <button class="btn btn-primary" id="btnExtract" onclick="extractPDF()" disabled>
              ⚡ 解析 PDF 文字
            </button>
            <button class="btn btn-secondary" id="btnSummary" onclick="generateSummary()" disabled>
              🧠 生成加權摘要
            </button>
            <button class="btn btn-secondary" id="btnScore" onclick="generateScore()" disabled>
              🎯 產生評分報告
            </button>
            <button class="btn btn-secondary" onclick="clearAll()">
              🗑 清除全部
            </button>
          </div>
        </div>
      </div>

      <!-- History Panel -->
      <div class="panel" id="historyPanel" style="display:none">
        <div class="panel-header">
          <span class="panel-dot" style="background:var(--yellow)"></span>
          歷史紀錄
          <span style="margin-left:auto;font-size:10px;cursor:pointer;color:var(--red)" onclick="clearHistory()">清除</span>
        </div>
        <div class="history-list" id="historyList"></div>
      </div>

    </div>

    <!-- ── Right: Results ── -->
    <div class="right-col">

      <!-- Raw Text Panel -->
      <div class="panel">
        <div class="panel-header">
          <span class="panel-dot" style="background:var(--text-dim)"></span>
          原始文字
          <span id="rawLabel" style="margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--text-dim)"></span>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <textarea class="raw-text" id="rawText" placeholder="解析後的 PDF 內容將顯示於此..."></textarea>
        <div class="status-line">
          <span class="status-dot" id="statusDot"></span>
          <span id="statusMsg">等待輸入 PDF...</span>
        </div>
      </div>

      <!-- Summary Panel -->
      <div class="panel">
        <div class="panel-header">
          <span class="panel-dot" style="background:var(--green)"></span>
          加權摘要
          <span id="summaryLabel" style="margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--text-dim)"></span>
          <button id="btnExportSummary" onclick="exportSummaryTxt()" disabled title="匯出摘要為 TXT" style="margin-left:10px;padding:2px 9px;background:var(--bg-hover);border:1px solid var(--border);border-radius:4px;color:var(--text-dim);font-size:10px;font-family:var(--mono);cursor:pointer">📥 TXT</button>
        </div>
        <div id="summaryContent">
          <div class="empty-state"><span>🧠</span>點擊「生成加權摘要」後顯示結果</div>
        </div>
      </div>

      <!-- Score Panel -->
      <div class="panel">
        <div class="panel-header">
          <span class="panel-dot" style="background:var(--yellow)"></span>
          評分報告
          <button onclick="exportScoreJson()" title="匯出評分報告為 JSON" style="margin-left:auto;padding:2px 9px;background:var(--bg-hover);border:1px solid var(--border);border-radius:4px;color:var(--text-dim);font-size:10px;font-family:var(--mono);cursor:pointer">📥 JSON</button>
        </div>
        <div id="scoreContent">
          <div class="empty-state"><span>🎯</span>點擊「產生評分報告」後顯示結果</div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="app.js"></script>

<!-- Model Manager Modal -->
<div id="modelManagerModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:998;backdrop-filter:blur(4px)" onclick="if(event.target===this)closeModelManager()">
  <div style="width:min(1100px,96vw);height:min(88vh,820px);margin:3% auto;background:var(--bg-panel);border:1px solid var(--border);border-radius:14px;display:flex;flex-direction:column;overflow:hidden">

    <!-- Modal Header -->
    <div style="padding:18px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0">
      <span style="font-size:15px;font-weight:600;letter-spacing:.04em;color:var(--text-primary)">🗂 模型資產管理</span>
      <div style="display:flex;align-items:center;gap:12px">
        <span style="font-size:11px;font-family:var(--mono);color:var(--text-dim)">啟用模型後引擎自動套用 · 點外側關閉</span>
        <button onclick="closeModelManager()" style="padding:6px 14px;background:var(--bg-card);border:1px solid var(--border);border-radius:6px;color:var(--text-secondary);font-size:12px;cursor:pointer">✕ 關閉</button>
      </div>
    </div>

    <!-- Modal Body: left list + right editor -->
    <div style="display:grid;grid-template-columns:260px 1fr;flex:1;overflow:hidden">

      <!-- Left: model list -->
      <div style="border-right:1px solid var(--border);overflow-y:auto;padding:16px;display:flex;flex-direction:column">
        <button onclick="createModel()" style="width:100%;padding:10px;background:var(--accent);border:none;border-radius:8px;color:#fff;font-family:var(--sans);font-size:13px;font-weight:500;cursor:pointer;margin-bottom:12px;flex-shrink:0">➕ 新增模型</button>
        <div id="modelList"></div>
      </div>

      <!-- Right: model editor -->
      <div id="modelEditor" style="overflow-y:auto;padding:24px">
        <div style="text-align:center;color:var(--text-dim);padding:80px 20px;font-size:13px">選擇左側模型開始編輯</div>
      </div>

    </div>
  </div>
</div>

<!-- Settings Modal -->
<div id="settingsModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:999;backdrop-filter:blur(4px)" onclick="if(event.target===this)closeSettings()">
  <div style="width:min(920px,95vw);max-height:84vh;overflow:auto;margin:4% auto;background:var(--bg-panel);border:1px solid var(--border);padding:28px;border-radius:14px">

    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px">
      <span style="font-size:15px;font-weight:600;letter-spacing:.04em;color:var(--text-primary)">⚙️ 引擎設定</span>
      <span style="font-size:11px;font-family:var(--mono);color:var(--text-dim)">JSON 格式 · 儲存後立即生效 · 點外側關閉</span>
    </div>

    <textarea id="settingsEditor"
      style="width:100%;height:420px;background:var(--bg-deep);color:var(--green);font-family:var(--mono);font-size:12px;line-height:1.7;padding:16px;border:1px solid var(--border);border-radius:8px;resize:vertical;outline:none"
      spellcheck="false"></textarea>

    <div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap">
      <span id="jsonValidIndicator" style="font-size:12px;font-family:var(--mono);align-self:center"></span>
      <button onclick="saveSettings()"   style="padding:10px 20px;background:var(--accent);border:none;border-radius:8px;color:#fff;font-family:var(--sans);font-size:13px;font-weight:500;cursor:pointer">💾 儲存</button>
      <button onclick="resetSettings()"  style="padding:10px 20px;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;color:var(--text-secondary);font-family:var(--sans);font-size:13px;cursor:pointer">↩ 還原預設</button>
      <button onclick="exportSettings()" style="padding:10px 20px;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;color:var(--text-secondary);font-family:var(--sans);font-size:13px;cursor:pointer">📤 匯出 JSON</button>
      <button onclick="closeSettings()"  style="padding:10px 20px;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;color:var(--text-secondary);font-family:var(--sans);font-size:13px;cursor:pointer">✕ 關閉</button>
    </div>

  </div>
</div>

</body>
</html>
